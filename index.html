<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Investment Life Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="startScreen" class="start-screen">
  <div class="start-card">
    <div class="eyebrow">INVESTMENT LIFE SIMULATOR</div>
    <h1>投資人生<br>シミュレーター</h1>
    <p>ゲーム開始時の初期資金を決めてください。</p>
    <div class="capital-grid">
      <button class="capital" data-capital="500000">50万円</button>
      <button class="capital" data-capital="1000000">100万円</button>
      <button class="capital" id="customButton">自由入力</button>
    </div>
    <div id="customArea" class="hidden">
      <label for="customCapital">初期資金（円）</label>
      <input id="customCapital" type="number" min="10000" step="10000" value="1000000" inputmode="numeric">
    </div>
    <div id="chosen" class="chosen">初期資金を選択してください</div>
    <button id="startGame" class="start-game" disabled>ゲームスタート</button>
  </div>
</section>

<div id="game" class="hidden">
<header class="header">
  <div>
    <div class="eyebrow">INVESTMENT LIFE SIMULATOR</div>
    <h2 id="gameDate">2000/01/03</h2>
  </div>
  <span id="marketStatus">市場休場</span>
</header>

<main>
<section id="home" class="screen active">
  <h1>ホーム</h1>
  <div class="stats">
    <div><span>総資産</span><b id="total">¥0</b></div>
    <div><span>現金</span><b id="cash">¥0</b></div>
    <div><span>投資資産</span><b id="invested">¥0</b></div>
    <div><span>本日の損益</span><b id="daily">¥0</b></div>
  </div>
  <div class="card overall">
    <span>ゲーム開始からの総合損益</span>
    <strong id="overall">¥0</strong>
    <small id="returnRate">0.00%</small>
  </div>
  <div class="card">
    <div class="title-row"><h3>📰 ニュース</h3><small>その時点の情報</small></div>
    <p id="news">市場シミュレーションを開始しました。</p>
  </div>
</section>

<section id="portfolio" class="screen">
  <h1>ポートフォリオ</h1>
  <div class="card">
    <span>投資資産</span>
    <strong class="big" id="portfolioTotal">¥0</strong>
  </div>
  <div class="card" id="holdings"><p class="muted">まだ銘柄を保有していません。</p></div>
</section>

<section id="trade" class="screen">
  <h1>取引</h1>
  <div class="card">
    <div class="title-row">
      <div><h3 id="stockName">Apple</h3><small id="ticker">AAPL</small></div>
      <strong id="price">$3.69</strong>
    </div>
    <div id="stockList" class="stock-list"></div>
  </div>
  <div class="card">
    <label>数量</label>
    <input id="quantity" type="number" min="1" value="1" inputmode="numeric">
    <div class="actions">
      <button id="buy">買う</button>
      <button id="sell">売る</button>
    </div>
  </div>
</section>
</main>

<nav class="bottom-nav">
  <button class="nav active" data-target="home"><span>⌂</span><small>ホーム</small></button>
  <button class="nav" data-target="portfolio"><span>▤</span><small>ポートフォリオ</small></button>
  <button class="nav" data-target="trade"><span>↕</span><small>取引</small></button>
</nav>
</div>
<script src="app.js"></script>
</body>
</html>
