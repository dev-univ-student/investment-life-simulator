<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Investment Life Simulator v0.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">INVESTMENT LIFE SIMULATOR</div>
      <h1 id="date">2000/01/03</h1>
      <span id="marketStatus" class="badge">市場休場</span>
    </div>
    <button id="resetBtn" class="ghost">リセット</button>
  </header>

  <main>
    <section class="summary card">
      <div><span>総資産</span><strong id="totalAssets">¥500,000</strong></div>
      <div><span>現金</span><strong id="cash">¥500,000</strong></div>
      <div><span>投資資産</span><strong id="invested">¥0</strong></div>
      <div><span>本日の損益</span><strong id="dailyPnl">¥0</strong></div>
    </section>

    <section class="card chart-card">
      <div class="section-head">
        <div>
          <span class="muted">選択中</span>
          <h2 id="selectedName">Apple</h2>
        </div>
        <div class="price-box">
          <strong id="selectedPrice">$3.69</strong>
          <span id="selectedChange">+0.0%</span>
        </div>
      </div>
      <canvas id="chart" height="190"></canvas>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>市場</h2>
        <span class="muted">7銘柄</span>
      </div>
      <div id="stockList" class="stock-list"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>保有銘柄</h2>
        <span id="holdingCount" class="muted">0銘柄</span>
      </div>
      <div id="holdings" class="empty">まだ銘柄を保有していません。</div>
    </section>

    <section class="card news">
      <div class="section-head"><h2>📰 NEWS</h2></div>
      <div id="newsText">市場シミュレーションを開始しました。</div>
    </section>
  </main>

  <nav class="trade-panel">
    <div class="trade-row">
      <button id="buyBtn" class="primary">買う</button>
      <button id="sellBtn">売る</button>
      <input id="qty" type="number" min="1" value="1" inputmode="numeric" aria-label="数量">
      <span id="unit">株</span>
    </div>
    <div class="time-row">
      <span>時間を進める</span>
      <button data-step="1">1日</button>
      <button data-step="7">1週間</button>
      <button data-step="30">1か月</button>
    </div>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
